name: CI / Deploy

# Every push to main publishes the site. Pull requests run the same checks and
# build, so breakage is caught before it can reach main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs an OIDC token to publish the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish. Pull
# request runs are superseded freely.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # PageProps and LayoutProps are generated into .next/types and referenced
      # from next-env.d.ts. Both are gitignored, so a clean checkout has neither
      # and tsc cannot resolve them until they are generated.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit
      # Next 16 dropped linting from `next build`, so it has to run on its own
      # or lint errors reach production unnoticed.
      - name: Lint
        run: npx eslint .

  build:
    name: Build static export
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Build
        run: npx next build
        env:
          # Canonical, Open Graph and sitemap URLs are absolute, so the real
          # origin has to be known at build time.
          NEXT_PUBLIC_SITE_URL: https://darshakdharaiya.github.io

      # Without this, Pages runs the output through Jekyll, which skips
      # directories beginning with an underscore — including _next, which
      # holds every script and stylesheet.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Guards the failures that actually bite on a static export: a route that
      # silently stopped emitting, or a generated file that is not what it claims.
      - name: Verify export
        run: |
          set -euo pipefail
          for f in index.html 404.html robots.txt sitemap.xml resume.pdf \
                   work/gallery-photos-videos/index.html work/messages/index.html \
                   work/calendar/index.html work/pdf-reader/index.html \
                   og.png work/calendar/og.png blog/index.html \
                   blog/edge-to-edge-is-not-optional/index.html \
                   blog/edge-to-edge-is-not-optional/og.png; do
            [ -s "out/$f" ] || { echo "::error::missing or empty: out/$f"; exit 1; }
          done
          # .nojekyll is deliberately empty, so only its presence can be checked.
          [ -e out/.nojekyll ] || { echo "::error::missing: out/.nojekyll"; exit 1; }
          head -c 5 out/resume.pdf | grep -q '%PDF' || { echo "::error::out/resume.pdf is not a PDF"; exit 1; }
          # A link preview served with the wrong content type is rejected by every
          # crawler, so check the bytes really are a PNG and not an error page.
          file --mime-type -b out/og.png | grep -q '^image/png$' || { echo "::error::out/og.png is not a PNG"; exit 1; }
          grep -q 'darshakdharaiya.github.io' out/sitemap.xml || { echo "::error::sitemap has the wrong origin"; exit 1; }
          [ -d out/_next ] || { echo "::error::out/_next is missing"; exit 1; }
          echo "export verified: $(du -sh out | cut -f1)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
